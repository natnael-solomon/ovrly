name: Bug
description: Something the app or tooling does that it should not.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Exact behaviour, error text or screenshot. Redact personal media and serial numbers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Commit SHA or PR, and debug/release.
      placeholder: "951101f debug"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Model and Android version only (no serial). Emulator image if applicable.
      placeholder: "Samsung SM-A217F, Android 12 · or · Pixel 6 emulator, API 35"
  - type: input
    id: route
    attributes:
      label: Route
      description: Launcher, provider app, network state or other context that matters.
      placeholder: "One UI Home · YouTube Shorts · Wi-Fi"
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options: [Always, Sometimes, Once]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Logs, related issues, suspected cause.