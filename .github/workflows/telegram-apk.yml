name: Telegram APK

on:
  workflow_dispatch:
  # Temporary: lets the first run happen from this branch before merge. Remove before merging.
  push:
    branches: [feat/telegram-apk]

permissions:
  contents: read

jobs:
  apk:
    name: Build and send APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure required Android SDK packages
        run: |
          missing=()
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]]; then
            missing+=("platforms;android-37.0")
          fi
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            missing+=("build-tools;36.0.0")
          fi
          if (( ${#missing[@]} )); then
            sdkmanager --install "${missing[@]}"
          fi

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: enhanced
          cache-read-only: true

      - name: Build release APK
        working-directory: android
        run: sh gradlew --no-daemon --console=plain --build-cache :app:assembleRelease

      - name: Collect build metadata
        id: meta
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        run: python3 .github/scripts/telegram_apk.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.meta.outputs.apk }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SUBJECT: ${{ steps.meta.outputs.subject }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_TYPE: unsigned, minified release build
