name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Static ffmpeg/ffprobe 6.0 (same major as Ubuntu 24.04's apt ffmpeg 6.1) from pinned,
# checksum-verified GitHub release assets, instead of an apt update and install on every
# run (median 0.4 min, but up to 3 min and once a 40-minute hang).
env:
  MEDIA_TOOLS_RELEASE: b6.0
  FFMPEG_GZ_SHA256: 17c1ae10b52ac499180679fe6ba77e17642390c4eedb0f1e3b0ac045da55128f
  FFPROBE_GZ_SHA256: 88ca6818d82a70e87de2bb6166026ad411528c72eda0e4e11ed25d185116ee17

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change detection and coverage policy
        run: >-
          python3 -m unittest discover -s .github/scripts -p 'test_backend_*.py' -v
      - name: Detect backend changes
        id: changes
        run: python3 .github/scripts/backend_changes.py

  validate:
    name: Validate backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # Runs this change's suite once and compares coverage with the report the main push
    # of the baseline commit cached. Without that cache it warns and runs main's suite
    # too, so 40 minutes leaves headroom for two suites on a slow runner.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OVRLY_DATABASE_URL: postgresql+psycopg://ovrly:ci-only@127.0.0.1:5432/ovrly
      OVRLY_TEST_DATABASE_URL: postgresql+psycopg://ovrly:ci-only@127.0.0.1:5432/ovrly
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ovrly
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ovrly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ovrly -d ovrly"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.21'
          python-version: '3.11'
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Restore pinned media tools
        id: media-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ovrly-media-tools
          key: media-tools-ffmpeg-static-${{ env.MEDIA_TOOLS_RELEASE }}-${{ env.FFMPEG_GZ_SHA256 }}-${{ env.FFPROBE_GZ_SHA256 }}
      - name: Install pinned media tools
        # Bounded: a stalled download fails in minutes instead of hanging the job.
        timeout-minutes: 5
        working-directory: .
        run: bash .github/scripts/media_tools.sh
      - name: Save pinned media tools (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.media-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ovrly-media-tools
          key: media-tools-ffmpeg-static-${{ env.MEDIA_TOOLS_RELEASE }}-${{ env.FFMPEG_GZ_SHA256 }}-${{ env.FFPROBE_GZ_SHA256 }}
      - name: Lint and formatting
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Strict types
        run: uv run --frozen mypy --strict services/
      - name: Contract schemas, fixtures and server round-trip
        run: >-
          uv run --frozen python ../packages/contracts/validate.py
          && uv run --frozen python ../packages/contracts/roundtrip.py --check
      - name: Upgrade database and check migration drift
        run: uv run --frozen alembic upgrade head && uv run --frozen alembic check
      - name: Select main coverage baseline
        id: baseline
        run: |
          sha="$(uv run --frozen python ../.github/scripts/backend_checks.py --baseline-sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore main coverage baseline
        # Exact commit only: an older main report is never substituted. A miss falls back
        # to remeasuring main in the next step, with a warning. The cache version hashes the
        # path list, so restore and save must use the identical path or no key ever matches.
        if: steps.baseline.outputs.sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/reports/main-baseline
          key: backend-coverage-main-${{ steps.baseline.outputs.sha }}
      - name: Test and compare coverage with main
        id: checks
        env:
          SAVE_BASELINE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          args=(--cached-baseline reports/main-baseline)
          if [[ "$SAVE_BASELINE" == true ]]; then
            args+=(--save-baseline reports/main-baseline)
          fi
          uv run --frozen python ../.github/scripts/backend_checks.py "${args[@]}"
      - name: Save main coverage baseline
        # Only a passing main push publishes its report as the baseline for its commit.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.checks.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/reports/main-baseline
          key: backend-coverage-main-${{ github.sha }}
      - name: Upload backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/reports/junit.xml
            backend/reports/coverage.xml
            backend/reports/coverage.json
            backend/reports/main/junit.xml
            backend/reports/main/coverage.xml
            backend/reports/main/coverage.json
            backend/reports/summary.md
            backend/reports/comparison.json
          retention-days: 7
          if-no-files-found: warn

  recovery:
    name: Validate recovery
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OVRLY_DATABASE_URL: postgresql+psycopg://ovrly:ci-only@127.0.0.1:5432/ovrly
      OVRLY_TEST_DATABASE_URL: postgresql+psycopg://ovrly:ci-only@127.0.0.1:5432/ovrly
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ovrly
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ovrly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ovrly -d ovrly"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.21'
          python-version: '3.11'
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Restore pinned media tools
        id: media-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ovrly-media-tools
          key: media-tools-ffmpeg-static-${{ env.MEDIA_TOOLS_RELEASE }}-${{ env.FFMPEG_GZ_SHA256 }}-${{ env.FFPROBE_GZ_SHA256 }}
      - name: Install pinned media tools
        # Bounded: a stalled download fails in minutes instead of hanging the job.
        timeout-minutes: 5
        working-directory: .
        run: bash .github/scripts/media_tools.sh
      - name: Upgrade database
        run: uv run --frozen alembic upgrade head
      - name: Job state machine properties and recovery cases
        run: >-
          uv run --frozen pytest -q -p no:cacheprovider
          --junitxml=reports/recovery-junit.xml
          tests/test_job_states.py tests/test_job_retries.py tests/test_job_queue.py tests/recovery
      - name: Upload recovery report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-recovery-report
          path: backend/reports/recovery-junit.xml
          retention-days: 7
          if-no-files-found: warn

  result:
    name: Backend checks
    if: ${{ always() }}
    needs: [changes, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.backend }}
      VALIDATION: ${{ needs.validate.result }}
    steps:
      - name: Report backend result
        shell: bash
        run: |
          if [[ "$DETECTION" != success ]]; then
            echo "::error::Backend change detection did not succeed."
            exit 1
          fi
          if [[ "$REQUIRED" == false && "$VALIDATION" == skipped ]]; then
            echo "No backend paths changed: backend execution skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUIRED" == true && "$VALIDATION" == success ]]; then
            echo "Backend validation passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Backend validation failed, was cancelled, or did not run."
            exit 1
          fi

  recovery_result:
    name: Backend recovery
    if: ${{ always() }}
    needs: [changes, recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.backend }}
      VALIDATION: ${{ needs.recovery.result }}
    steps:
      - name: Report recovery result
        shell: bash
        run: |
          if [[ "$DETECTION" != success ]]; then
            echo "::error::Backend change detection did not succeed."
            exit 1
          fi
          if [[ "$REQUIRED" == false && "$VALIDATION" == skipped ]]; then
            echo "No backend paths changed: recovery suite skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REQUIRED" == true && "$VALIDATION" == success ]]; then
            echo "Recovery suite passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Recovery suite failed, was cancelled, or did not run."
            exit 1
          fi
