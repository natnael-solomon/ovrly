name: Quality gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OVRLY_REQUIRE_QUALITY_TOOLS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.21'
          python-version: '3.11'
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install locked quality tools
        run: uv sync --project backend --frozen --group quality
      - name: Run the local pre-commit gates
        run: uv run --project backend --frozen --group quality pre-commit run --all-files
