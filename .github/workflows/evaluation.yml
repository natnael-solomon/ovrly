name: Evaluation contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evaluation:
    name: Evaluation contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test validator and negative cases
        run: python3 -m unittest discover -s evaluation/tests -p 'test_*.py' -v

      - name: Validate synthetic examples
        run: python3 evaluation/validate.py

      - name: Validate frozen metadata if present
        shell: bash
        run: |
          if [[ -e evaluation/corpus ]]; then
            python3 evaluation/validate.py evaluation/corpus --frozen
          else
            echo "No reviewed corpus yet. Synthetic examples are not evaluation evidence."
          fi
