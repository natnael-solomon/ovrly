name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Detect Android changes
        id: changes
        run: python3 .github/scripts/android_changes.py

      - name: Set up JDK 21
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure required Android SDK packages
        if: steps.changes.outputs.android == 'true'
        run: |
          missing=()
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]]; then
            missing+=("platforms;android-37.0")
          fi
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            missing+=("build-tools;36.0.0")
          fi
          if (( ${#missing[@]} )); then
            sdkmanager --install "${missing[@]}"
          else
            echo "Required SDK packages are already installed."
          fi

      - name: Set up Gradle and validate wrappers
        if: steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Build, unit test and lint
        id: build
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: >-
          sh gradlew --no-daemon --console=plain --build-cache --continue
          --dependency-verification=strict
          :app:assembleDebug :app:testDebugUnitTest :app:lintDebug qualityCheck

      - name: Build unsigned release fixture
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: >-
          sh gradlew --no-daemon --console=plain --build-cache
          -Povrly.versionCode=2 :app:assembleRelease :app:cyclonedxDirectBom

      - name: Check version-code property bounds (configuration only)
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          expect_ok() {
            sh gradlew --no-daemon --console=plain --offline -q -Povrly.versionCode="$1" help >/dev/null \
              || { echo "::error::ovrly.versionCode=$1 must be accepted"; exit 1; }
          }
          expect_rejected() {
            if out=$(sh gradlew --no-daemon --console=plain --offline -q -Povrly.versionCode="$1" help 2>&1); then
              echo "::error::ovrly.versionCode=$1 must be rejected"; exit 1
            fi
            grep -Fq "ovrly.versionCode must be an integer in 1..2100000000, got '$1'" <<<"$out" \
              || { echo "::error::ovrly.versionCode=$1 was rejected without the expected message"; echo "$out" | tail -n 20; exit 1; }
          }
          expect_ok 1
          expect_ok 2100000000
          expect_rejected 0
          expect_rejected 2100000001
          expect_rejected abc

      - name: Verify release signing with ephemeral key
        if: steps.changes.outputs.android == 'true'
        env:
          OVRLY_UNSIGNED_APK: ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release-unsigned.apk
        run: |
          if [[ ! -f android/app/build/outputs/mapping/release/mapping.txt ]]; then
            echo "::error::R8 mapping is missing from the release fixture"
            exit 1
          fi
          python3 - <<'PY'
          import os, sys, unittest
          sys.path.insert(0, ".github/scripts")
          from release_publish import badging, tools_from_env, verify_badging

          verify_badging(badging(tools_from_env()["aapt2"], os.environ["OVRLY_UNSIGNED_APK"]), 2)
          suite = unittest.defaultTestLoader.loadTestsFromName("test_release_publish.RealToolSigningTest")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 1:
              sys.exit("::error::Real APK signing fixture must run and pass without skips")
          PY

      - name: Upload test and lint reports
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.build.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*
            android/build/reports/detekt/
            android/build/reports/dependency-verification/
            android/build/reports/ktlint/
            android/app/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: warn
