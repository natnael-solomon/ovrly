name: ovrly-backend-dev

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ovrly
      POSTGRES_DB: ovrly
      POSTGRES_PASSWORD: ${OVRLY_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${OVRLY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovrly -d ovrly"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
